<main class="not-found">

  <section class="not-found__card" role="alert">

    <p class="not-found__code">404</p>

    <h1>Page not found</h1>

    <p class="not-found__text">
      The page you are looking for does not exist or has been moved.
    </p>

    <div class="not-found__actions">

      <a routerLink="/" class="not-found__button not-found__button--primary">
        Back to Home
      </a>

      @if (auth.isLoggedIn()) {
        <a routerLink="/profile" class="not-found__button not-found__button--secondary">
          My Profile
        </a>
      } @else {
        <a routerLink="/login" class="not-found__button not-found__button--secondary">
          Login
        </a>
      }

    </div>

  </section>

</main>
